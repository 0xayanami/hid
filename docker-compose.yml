services:
  hideck:
    image: hideck:volte-fixed-a338bfd9c85228860d75ab7a73b9a4ce6a069b87
    pull_policy: never
    container_name: hideck
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # host 网络让 HiDeck 直接监听配置的 UDP 端口，WebRTC 媒体不经过 Caddy。
    network_mode: host
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      # Keep the whole /dev bind: USB re-enumeration changes ADB and PCM nodes.
      - /dev:/dev
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config/config.yaml
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
